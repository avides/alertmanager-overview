# This configuration is used for the deployment and publish to docker
name: release

on:
  push:
    branches:
      # Runs only on push to the master branch
      - master

jobs:
  release:
    timeout-minutes: 30
      
    runs-on: ubuntu-latest

    steps:
      # Checkout the git repository
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Get the current project version from version.txt
      - name: get-project-version
        id: get_project_version
        uses: avides/actions-project-version-check@fdcc0b518640acac421d60de17201bb2bbb80a77 # v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          file-to-check: version.txt
          only-return-version: true

      # Build and publish docker image
      - name: push-image
        env:
          PROJECT_VERSION: ${{ steps.get_project_version.outputs.version }}
        run: |
          echo ${{ secrets.DOCKER_REGISTRY_TOKEN }} | docker login ${{ secrets.DOCKER_REGISTRY }} -u ${{ secrets.DOCKER_REGISTRY_USER }} --password-stdin
          if [[ "${{ steps.get_project_version.outputs.version }}" == *"SNAPSHOT"* || "${{ steps.get_project_version.outputs.version }}" == *"RC"* ]]; then
            docker build -t ${{ secrets.DOCKER_REGISTRY }}/${GITHUB_REPOSITORY}:${PROJECT_VERSION} .
            docker push ${{ secrets.DOCKER_REGISTRY }}/${GITHUB_REPOSITORY}:${PROJECT_VERSION}
          else
            docker build -t ${{ secrets.DOCKER_REGISTRY }}/${GITHUB_REPOSITORY}:${PROJECT_VERSION} -t ${{ secrets.DOCKER_REGISTRY }}/${GITHUB_REPOSITORY}:latest .
            docker push ${{ secrets.DOCKER_REGISTRY }}/${GITHUB_REPOSITORY}:${PROJECT_VERSION}
            docker push ${{ secrets.DOCKER_REGISTRY }}/${GITHUB_REPOSITORY}:latest
          fi

      # Setup the sonar analyse scanner
      - name: setup-sonar
        uses: warchant/setup-sonar-scanner@911ef81b14b267a261d70ac94e43d3c822a709d5 # v10

      # Execute sonar analysis and publish results to the sonarqube server
      - name: sonar
        env:
          PROJECT_VERSION: ${{ steps.get_project_version.outputs.version }}
        run: |
          sonar-scanner \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.projectKey=${GITHUB_REPOSITORY//\//:} \
            -Dsonar.projectVersion=${PROJECT_VERSION} \
            -Dsonar.branch.name=${{ github.ref_name }}

      # Get last commit message for GitHub Release tag
      - name: setup-github-release
        id: setup_github_release
        env:
          PROJECT_VERSION: ${{ steps.get_project_version.outputs.version }}
        run: |
          echo "gitcommitmessage=$(git log --no-merges -1 --oneline)" >> $GITHUB_OUTPUT
          if [[ "$PROJECT_VERSION" == *"SNAPSHOT"* || "$PROJECT_VERSION" == *"RC"* ]]; then
            echo "isprerelease=true" >> $GITHUB_OUTPUT
          else
            echo "isprerelease=false" >> $GITHUB_OUTPUT
          fi

      # Create and publish GitHub Release tag
      - name: github-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          token: ${{ secrets.GPR_TOKEN }}
          tag_name: ${{ steps.get_project_version.outputs.version }}
          body: ${{ steps.setup_github_release.outputs.gitcommitmessage }}
          prerelease: ${{ steps.setup_github_release.outputs.isprerelease }}
