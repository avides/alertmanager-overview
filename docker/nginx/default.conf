server
{
    listen       80;
    server_name  localhost;

    access_log  /var/log/nginx/host.access.log  main;

    location /
    {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    location = /config.json
    {
        root        /usr/share/nginx/html;
        add_header  Cache-Control no-store;
    }
}
